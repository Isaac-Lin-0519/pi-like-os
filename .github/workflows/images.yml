# ==================================================================
# 建立 pi、sim 兩個 image（amd64 + arm64），推到 GitHub Container Registry
#
#   推 v1.2.3 標籤 → 建立並推送 1.2.3 版（不使用 latest）
#   推到 main、Pull request → 只測試和建立，不推送
#
# 版本規則：
#   - docker-compose.yml 裡的 image 版本必須和標籤相同，不同就失敗（避免使用者拿到錯的版本）
#   - 每個 action 都用 commit SHA 固定版本，後面的註解是對應的版本號
#   - 執行環境固定為 ubuntu-24.04，Node.js 固定版本
#
# arm64 在 amd64 的機器上用 QEMU 模擬建立，比較慢（約 10～20 分鐘）。
# ==================================================================
name: images

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read
  packages: write

env:
  IS_RELEASE: ${{ startsWith(github.ref, 'refs/tags/v') }}

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.4.1
      - name: 電路求解器測試
        run: node sim/tests/circuit.test.mjs

      - name: 檢查版本號（docker-compose.yml 和標籤要相同）
        if: env.IS_RELEASE == 'true'
        run: |
          version="${GITHUB_REF_NAME#v}"
          for svc in pi sim; do
            if ! grep -q "pi-like-os/${svc}:${version}\$" docker-compose.yml; then
              echo "::error file=docker-compose.yml::${svc} 的 image 版本不是 ${version}。請先執行 scripts/release.sh ${version}"
              exit 1
            fi
          done
          echo "版本 ${version}：docker-compose.yml 正確"

  build:
    needs: test
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        service: [pi, sim]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: 登入 ghcr.io
        if: env.IS_RELEASE == 'true'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # image 名稱必須是小寫：ghcr.io/<帳號>/pi-like-os/<服務>
      - name: image 名稱
        id: name
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/pi-like-os/${{ matrix.service }}" >> "$GITHUB_OUTPUT"

      # 只產生 1.2.3 這種完整版本號，不產生 latest
      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: meta
        with:
          images: ${{ steps.name.outputs.image }}
          flavor: latest=false
          tags: type=semver,pattern={{version}}

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./${{ matrix.service }}
          platforms: linux/amd64,linux/arm64
          push: ${{ env.IS_RELEASE == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
