<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title data-i18n="page.title">虛擬麵包板</title>
<style>
  :root {
    --bg: #f5f4ef;
    --panel: #ffffff;
    --canvas: #fbfaf6;
    --ink: #1f2328;
    --muted: #6a6f76;
    --line: #dcd9d0;
    --accent: #1f6b3a;
    --ok: #1a7f37;
    --warn: #9a6700;
    --bad: #cf222e;
    --ok-bg: #e9f6ec;
    --warn-bg: #fff6d6;
    --bad-bg: #ffe9e9;
    --info-bg: #eaf2ff;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #16181c; --panel: #1f2228; --canvas: #23262d; --ink: #e6e6e6; --muted: #9aa0a6; --line: #333842;
      --ok: #4ac26b; --warn: #d4a72c; --bad: #ff6b6b;
      --ok-bg: #1b2e22; --warn-bg: #33290f; --bad-bg: #3a1a1c; --info-bg: #1a2638;
    }
  }
  :root[data-theme="dark"] {
    --bg: #16181c; --panel: #1f2228; --canvas: #23262d; --ink: #e6e6e6; --muted: #9aa0a6; --line: #333842;
    --ok: #4ac26b; --warn: #d4a72c; --bad: #ff6b6b;
    --ok-bg: #1b2e22; --warn-bg: #33290f; --bad-bg: #3a1a1c; --info-bg: #1a2638;
  }

  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang TC", "Microsoft JhengHei", sans-serif;
  }
  body.dragging { cursor: grabbing; user-select: none; }
  button, select { font: inherit; color: inherit; }
  select { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 3px 6px; }
  button {
    background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 4px 10px; cursor: pointer;
  }
  button:hover { border-color: var(--muted); }

  header {
    display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
    padding: 10px 16px; border-bottom: 1px solid var(--line); background: var(--panel);
  }
  header h1 { font-size: 17px; margin: 0; }
  header .spacer { flex: 1; }
  .status { font-size: 12px; padding: 2px 10px; border-radius: 999px; border: 1px solid var(--line); white-space: nowrap; }
  .status.ok { color: var(--ok); border-color: var(--ok); }
  .status.bad { color: var(--bad); border-color: var(--bad); }
  .muted { color: var(--muted); }

  .workspace {
    display: grid; grid-template-columns: 210px minmax(0, 1fr); gap: 12px; padding: 12px 16px;
  }
  aside { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px; min-width: 0; }
  .card h2 { font-size: 13px; margin: 0 0 8px; color: var(--muted); font-weight: 600; }
  .card h3 { font-size: 14px; margin: 0 0 6px; }
  .card p { margin: 6px 0; font-size: 13px; }
  .card label { display: flex; align-items: center; gap: 8px; font-size: 13px; }

  #toolbox { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  .tool {
    display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 6px 4px;
    touch-action: none; cursor: grab; font-size: 12px; background: var(--canvas);
  }
  .tool svg { width: 100%; height: 34px; pointer-events: none; }
  .tool span { pointer-events: none; white-space: nowrap; }
  .tool.wide { grid-column: span 2; }
  table.adc { width: 100%; border-collapse: collapse; font: 12px ui-monospace, Menlo, Consolas, monospace; margin: 6px 0; }
  table.adc th, table.adc td { text-align: right; padding: 2px 4px; border-bottom: 1px solid var(--line); }
  table.adc th:first-child, table.adc td:first-child { text-align: left; }
  table.adc th { color: var(--muted); font-weight: 600; }

  .swatches { display: flex; flex-wrap: wrap; gap: 6px; }
  .swatch { width: 22px; height: 22px; padding: 0; border-radius: 50%; border: 2px solid var(--line); }
  .swatch.on { outline: 2px solid var(--ink); outline-offset: 2px; }
  .row { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
  .warn-text { color: var(--bad); }

  .canvas-wrap { position: relative; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
  #board { display: block; width: 100%; height: auto; touch-action: none; }
  #board .part { cursor: grab; }
  #board .part.selected > g { filter: drop-shadow(0 0 3px #22c55e) drop-shadow(0 0 2px #22c55e); }
  #board .wire { cursor: pointer; }
  #board .wire.selected path:nth-child(2) { filter: drop-shadow(0 0 3px #22c55e); }
  #board .wire .end { cursor: move; }
  #tip {
    position: absolute; pointer-events: none; white-space: pre-line; font-size: 12px; line-height: 1.45;
    background: #111c; color: #fff; padding: 6px 8px; border-radius: 6px; max-width: 280px; z-index: 2;
  }
  .help { font-size: 12px; color: var(--muted); margin: 6px 2px 0; }
  kbd { font: 11px ui-monospace, Menlo, Consolas, monospace; border: 1px solid var(--line); border-radius: 3px; padding: 0 4px; background: var(--canvas); }

  .panels { display: grid; grid-template-columns: minmax(0, 3fr) minmax(0, 2fr); gap: 12px; padding: 0 16px 16px; }
  #hints { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
  #hints li { padding: 6px 10px; border-radius: 6px; font-size: 13px; }
  #hints li[data-part] { cursor: pointer; }
  #hints .ok { background: var(--ok-bg); }
  #hints .info { background: var(--info-bg); }
  #hints .warn { background: var(--warn-bg); }
  #hints .danger { background: var(--bad-bg); }
  ul.programs { list-style: none; padding: 0; margin: 0 0 10px; font: 12px ui-monospace, Menlo, Consolas, monospace; }
  ul.programs li { padding: 3px 0; overflow-wrap: anywhere; }
  .log { font: 12px ui-monospace, Menlo, Consolas, monospace; max-height: 220px; overflow-y: auto; }
  .log div { padding: 2px 0; border-bottom: 1px solid var(--line); }
  .log .on { color: var(--bad); }

  @media (max-width: 900px) {
    .workspace { grid-template-columns: minmax(0, 1fr); }
    aside { order: 2; }
    #toolbox { grid-template-columns: repeat(auto-fill, minmax(80px, 1fr)); }
    .panels { grid-template-columns: minmax(0, 1fr); }
  }
</style>
</head>
<body>
<header>
  <h1 data-i18n="page.title">虛擬麵包板</h1>
  <span id="status" class="status bad" data-i18n="status.connecting">連線中…</span>
  <span class="spacer"></span>
  <select id="example-select" title="載入範例電路" data-i18n-title="example.title">
    <option value="" data-i18n="example.placeholder">範例電路…</option>
    <option value="led" data-i18n="example.led">LED 閃爍（GPIO18）</option>
    <option value="meter" data-i18n="example.meter">三段旋鈕儀表（MCP3008＋可變電阻）</option>
    <option value="rgb" data-i18n="example.rgb">RGB 三原色混色（按鈕 A／B／C）</option>
  </select>
  <button id="btn-export" title="把電路存成檔案" data-i18n="btn.export" data-i18n-title="btn.export.title">匯出</button>
  <button id="btn-import" title="從檔案載入電路" data-i18n="btn.import" data-i18n-title="btn.import.title">匯入</button>
  <button id="btn-clear" data-i18n="btn.clear">清空</button>
  <button id="btn-lang" lang="en" title="Switch to English" data-i18n="lang.switch" data-i18n-title="lang.switchTitle">English</button>
  <input id="file-import" type="file" accept=".json,application/json" hidden>
</header>

<div class="workspace">
  <aside>
    <div class="card">
      <h2 data-i18n="card.toolbox">元件（拖到麵包板上）</h2>
      <div id="toolbox"></div>
    </div>
    <div class="card">
      <h2 data-i18n="card.wire">杜邦線</h2>
      <div id="wire-colors" class="swatches"></div>
      <p class="help" data-i18n-html="help.wire">從排針或孔<b>拖</b>到另一個孔，就是一條線；也可以點起點、再點終點。</p>
    </div>
    <div class="card">
      <h2 data-i18n="card.props">選取的元件</h2>
      <div id="props"></div>
    </div>
  </aside>

  <div>
    <div class="canvas-wrap">
      <svg id="board" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Raspberry Pi 4 與麵包板" data-i18n-aria="board.aria"></svg>
      <div id="tip" hidden></div>
    </div>
    <p class="help" data-i18n-html="help.board">
      滑鼠移到孔上會用綠圈標出所有相通的點。選取後 <kbd>R</kbd> 旋轉、<kbd>Delete</kbd> 刪除、<kbd>Esc</kbd> 取消；按住按鈕＝按下；上下拖曳（或滾輪）轉動可變電阻的旋鈕。
    </p>
  </div>
</div>

<div class="panels">
  <section class="card">
    <h2 data-i18n="card.hints">電路提示</h2>
    <ul id="hints"></ul>
  </section>
  <section class="card">
    <h2 data-i18n="card.programs">執行中的程式</h2>
    <ul id="programs" class="programs"></ul>
    <h2 data-i18n="card.log">腳位變化紀錄</h2>
    <div id="log" class="log"><div class="muted" data-i18n="log.waiting">等待程式執行…</div></div>
  </section>
</div>

<script type="module" src="/static/app.js"></script>
</body>
</html>
